name: Deploy Tichu Rulebook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified Pages source
        run: unzip -q tichu-pages-source.zip -d .pages-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .pages-source/package-lock.json
      - run: npm ci
        working-directory: .pages-source
      - name: Check rules and game modes
        working-directory: .pages-source
        run: |
          node scripts/check-rule-lessons.cjs
          node scripts/check-game-modes.cjs
      - name: Build static website
        working-directory: .pages-source
        env:
          NEXT_PUBLIC_BASE_PATH: /TICHU-RULEBOOK
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-source/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
